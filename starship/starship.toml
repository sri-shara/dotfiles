# Minimal starship prompt
add_newline = true

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
format = "[$symbol($version)]($style) "
detect_files = ["package.json"]

[golang]
format = "[$symbol($version)]($style) "

[python]
format = "[$symbol($version)]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
